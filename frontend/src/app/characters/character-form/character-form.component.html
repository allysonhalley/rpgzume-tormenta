<mat-toolbar color="primary">
    <span>{{ isEditMode ? 'Editar Personagem' : 'Novo Personagem' }}</span>
</mat-toolbar>

<div class="container">
    <mat-card>
        <mat-card-content>
            <form (ngSubmit)="save()" #charForm="ngForm">
                <div class="row">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Nome do Personagem</mat-label>
                        <input matInput [(ngModel)]="character.name" name="name" required>
                    </mat-form-field>
                </div>

                <div class="row">
                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Raça</mat-label>
                        <mat-select [(ngModel)]="character.raceId" name="raceId" required>
                            <mat-option *ngFor="let race of races" [value]="race.id">
                                {{ race.name }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Classe Principal</mat-label>
                        <mat-select [(ngModel)]="character.principalClassId" name="principalClassId" required>
                            <mat-option *ngFor="let clazz of classes" [value]="clazz.id">
                                {{ clazz.name }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <div class="row">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Talentos (Features)</mat-label>
                        <mat-select [(ngModel)]="character.featureIds" name="featureIds" multiple>
                            <mat-option *ngFor="let feature of features" [value]="feature.id">
                                {{ feature.name }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <div class="row">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Magias</mat-label>
                        <mat-select [(ngModel)]="character.magicIds" name="magicIds" multiple>
                            <mat-option *ngFor="let magic of magics" [value]="magic.id">
                                {{ magic.name }} ({{ magic.level }})
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <div class="actions">
                    <button mat-raised-button color="primary" type="submit" [disabled]="!charForm.valid">
                        Salvar
                    </button>
                    <button mat-button type="button" (click)="cancel()">
                        Cancelar
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>

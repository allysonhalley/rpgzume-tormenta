<mat-toolbar color="primary">
    <span>Habilidades de Classe</span>
    <span class="spacer"></span>
</mat-toolbar>

<div class="container" *ngIf="classNames.length > 0; else noItems">
    <mat-tab-group animationDuration="0ms">
        <mat-tab *ngFor="let className of classNames" [label]="className">
            <div class="tab-content">
                <br>
                <div class="card-grid">
                    <mat-card class="card" *ngFor="let ability of groupedAbilities[className]" appearance="outlined">
                        <mat-card-header base="elevated-container-shape">
                            <!-- resume holds the Ability Name (e.g. Fúria) -->
                            <mat-card-title>{{ ability.name }}</mat-card-title>
                            <mat-card-subtitle>{{ ability.book }} - Pág. {{ ability.page }}</mat-card-subtitle>
                        </mat-card-header>
                        <mat-card-content>
                            <mat-divider></mat-divider>
                            <div class="description-content">
                                <ng-container *ngIf="formatTextToList(ability.description).length > 1; else simpleDesc">
                                    <p><strong>Descrição:</strong></p>
                                    <ul class="clean-list">
                                        <li *ngFor="let part of formatTextToList(ability.description)">
                                            <ng-container *ngIf="parseAbilityLine(part) as parsed">
                                                <strong *ngIf="parsed.label">{{ parsed.label }}:</strong>
                                                <span [innerHTML]="parseBold(parsed.text)"></span>
                                            </ng-container>
                                        </li>
                                    </ul>
                                </ng-container>
                                <ng-template #simpleDesc>
                                    <p class="description"><strong>Descrição: </strong>{{ ability.description }}</p>
                                </ng-template>
                            </div>

                            <div class="traits-section" *ngIf="ability.abilities">
                                <h4>Habilidades:</h4>
                                <ul class="clean-list">
                                    <li *ngFor="let item of formatTextToList(ability.abilities)">{{ item }}</li>
                                </ul>
                            </div>
                        </mat-card-content>
                    </mat-card>
                </div>
                <br><br>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>

<ng-template #noItems>
    <div class="container">
        <p>Nenhuma habilidade de classe encontrada.</p>
    </div>
</ng-template>

<mat-toolbar color="primary">
    <span>{{ isEditMode ? 'Editar Magia' : 'Nova Magia' }}</span>
</mat-toolbar>

<div class="container">
    <mat-card>
        <mat-card-content>
            <form (ngSubmit)="save()" #magicForm="ngForm">
                <div class="row">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Nome</mat-label>
                        <input matInput [(ngModel)]="magic.name" name="name" required>
                    </mat-form-field>
                </div>

                <div class="row">
                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Nível</mat-label>
                        <input matInput [(ngModel)]="magic.level" name="level" required>
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Tipo</mat-label>
                        <input matInput [(ngModel)]="magic.magicType" name="magicType" required>
                    </mat-form-field>
                </div>

                <div class="row">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Resumo</mat-label>
                        <textarea matInput [(ngModel)]="magic.resume" name="resume" rows="2"></textarea>
                    </mat-form-field>
                </div>

                <div class="row">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Descrição</mat-label>
                        <textarea matInput [(ngModel)]="magic.description" name="description" rows="5"></textarea>
                    </mat-form-field>
                </div>

                <div class="row">
                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Componentes</mat-label>
                        <input matInput [(ngModel)]="magic.components" name="components">
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Tempo de Conjuração</mat-label>
                        <input matInput [(ngModel)]="magic.castTime" name="castTime">
                    </mat-form-field>
                </div>

                <div class="row">
                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Alcance</mat-label>
                        <input matInput [(ngModel)]="magic.range" name="range">
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Área/Alvo</mat-label>
                        <input matInput [(ngModel)]="magic.targetArea" name="targetArea">
                    </mat-form-field>
                </div>

                <div class="row">
                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Livro</mat-label>
                        <input matInput [(ngModel)]="magic.book" name="book">
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Página</mat-label>
                        <input matInput type="number" [(ngModel)]="magic.page" name="page">
                    </mat-form-field>
                </div>

                <div class="actions">
                    <button mat-raised-button color="primary" type="submit" [disabled]="!magicForm.valid">
                        Salvar
                    </button>

                    <button mat-button type="button" (click)="cancel()">
                        Cancelar
                    </button>

                    <span class="spacer"></span>

                    <button mat-icon-button color="warn" type="button" *ngIf="isEditMode" (click)="deleteMagic()">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>

<div class="login-container">
    <mat-card class="login-card">
        <mat-card-header>
            <mat-card-title>{{ isRegistering ? 'Register' : 'Login' }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="fill" class="full-width" *ngIf="isRegistering">
                    <mat-label>Username (Not unique)</mat-label>
                    <input matInput formControlName="username" />
                </mat-form-field>

                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" type="email" />
                </mat-form-field>

                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>Password</mat-label>
                    <input matInput formControlName="password" type="password" />
                </mat-form-field>

                <div *ngIf="error" class="error-message">
                    {{ error }}
                </div>

                <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid"
                    class="submit-btn">
                    {{ isRegistering ? 'Register' : 'Login' }}
                </button>
            </form>

            <div class="google-login">
                <button mat-stroked-button color="accent" (click)="loginWithGoogle()">
                    Login with Google
                </button>
            </div>

            <div class="toggle-mode">
                <button mat-button (click)="toggleMode()">
                    {{ isRegistering ? 'Already have an account? Login' : 'Need an account? Register' }}
                </button>
            </div>
        </mat-card-content>
    </mat-card>
</div>
